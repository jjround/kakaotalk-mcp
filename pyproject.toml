[project]
name = "kakaotalk-mcp"
version = "0.1.4"
description = "PC 카카오톡 창을 윈도우 메시지로 조작하는 MCP 서버 (화면 캡처·마우스 조작 없음)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "정회진" }]
dependencies = [
    "mcp>=1.2.0,<2",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
kakaotalk-mcp = "kakaotalk_mcp.server:main"
kakaotalk-mcp-diag = "kakaotalk_mcp.diag:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kakaotalk_mcp"]
